name: dolshoe-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dolshoe_test
      POSTGRES_USER: dolshoe_test
      POSTGRES_PASSWORD: dolshoe_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolshoe_test -d dolshoe_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
