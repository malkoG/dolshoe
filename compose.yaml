services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dolshoe
      POSTGRES_USER: dolshoe
      POSTGRES_PASSWORD: dolshoe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolshoe -d dolshoe"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # One-shot migration gate: applies committed migrations before the API
  # is allowed to start. Not a long-running service.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["pnpm", "--filter", "@dolshoe/api", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://dolshoe:dolshoe@postgres:5432/dolshoe?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - api-node-modules:/app/apps/api/node_modules

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      LOG_RETENTION_DAYS: 14
      DATABASE_URL: postgresql://dolshoe:dolshoe@postgres:5432/dolshoe?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app/apps/api
      - api-node-modules:/app/apps/api/node_modules
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["pnpm", "--filter", "@dolshoe/web", "exec", "vite", "dev", "--port", "5173"]
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      - api
    ports:
      # Loopback-only. Empty DOLSHOE_WEB_PORT (the default) lets Docker pick
      # a free host port; discover it with `docker compose port web 5173`.
      # Set DOLSHOE_WEB_PORT for a stable, explicit port instead.
      - "127.0.0.1:${DOLSHOE_WEB_PORT:-}:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - web-node-modules:/app/apps/web/node_modules

volumes:
  postgres-data:
  api-node-modules:
  web-node-modules:
