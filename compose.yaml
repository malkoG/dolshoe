services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dolshoe
      POSTGRES_USER: dolshoe
      POSTGRES_PASSWORD: dolshoe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolshoe -d dolshoe"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # One-shot migration gate: applies committed migrations before the API
  # is allowed to start. Not a long-running service.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["pnpm", "--filter", "@dolshoe/api", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://dolshoe:dolshoe@postgres:5432/dolshoe?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - api-node-modules:/app/apps/api/node_modules

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      LOG_RETENTION_DAYS: 14
      DATABASE_URL: postgresql://dolshoe:dolshoe@postgres:5432/dolshoe?schema=public
      # Everything below is taken from `.env`, and empty unless it is set there.
      # Naming each one is what makes it reach the API at all: the container is
      # given an explicit environment rather than the host's, so a variable that
      # is missing here is a variable the documentation promises and the API
      # never sees.
      #
      # Empty is a value these are meant to take. All three OAuth variables unset
      # is the shipped state — the API starts, warns, and the sign-in page
      # explains that nobody can sign in yet — while a partial set is refused at
      # startup, so leaving one blank locally fails loudly rather than at the
      # redirect.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITHUB_ALLOWED_LOGINS: ${GITHUB_ALLOWED_LOGINS:-}
      MOCK_LOGIN: ${MOCK_LOGIN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app/apps/api
      - api-node-modules:/app/apps/api/node_modules
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["pnpm", "--filter", "@dolshoe/web", "exec", "vite", "dev", "--port", "5173"]
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      # The proxy above only serves requests the browser makes. A server-side
      # render fetches on its own, with no origin to resolve a relative URL
      # against, so it is given the API's address directly.
      DOLSHOE_API_ORIGIN: http://api:3000
    depends_on:
      - api
    ports:
      # Loopback-only. Empty DOLSHOE_WEB_PORT (the default) lets Docker pick
      # a free host port; discover it with `docker compose port web 5173`.
      # Set DOLSHOE_WEB_PORT for a stable, explicit port instead.
      - "127.0.0.1:${DOLSHOE_WEB_PORT:-}:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - web-node-modules:/app/apps/web/node_modules
      # The web app renders from the design system's TypeScript source rather
      # than a built artefact, so editing a component has to reach the dev
      # server the same way editing a route does.
      - ./packages/ui:/app/packages/ui
      - ui-node-modules:/app/packages/ui/node_modules

volumes:
  postgres-data:
  api-node-modules:
  web-node-modules:
  ui-node-modules:
