name: dolshoe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dolshoe
      POSTGRES_USER: dolshoe
      POSTGRES_PASSWORD: dolshoe
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolshoe -d dolshoe"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
